[project]
name = "names-commons-dataset"
version = "0.1.0"
description = "Dataset mundial de primeiros nomes e sobrenomes a partir de fontes oficiais e do Wikidata"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "benchcommons-tools-dataset==0.1.0",
    "pyarrow>=17",
    "pycountry>=24.6",
    "pyyaml>=6.0",
]

[project.scripts]
namescommons = "namescommons.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
benchcommons-tools-dataset = { git = "https://github.com/BenchCommons/tools-dataset", tag = "v0.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/namescommons"]
