[project]
name = "namesio"
version = "0.1.0"
description = "Dataset mundial de primeiros nomes e sobrenomes a partir de fontes oficiais e do Wikidata"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pyarrow>=17",
    "pycountry>=24.6",
    "pyyaml>=6.0",
]

[project.scripts]
namesio = "namesio.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
