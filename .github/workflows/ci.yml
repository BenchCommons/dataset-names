name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Instalar dependências
        run: uv sync
      - name: Testes
        run: uv run pytest -q
      - name: namescommons run --offline sobre o cache montado a partir das fixtures
        env:
          PYTHONPATH: tests
        run: |
          mkdir -p "$RUNNER_TEMP/cache"
          cp -R tests/fixtures/exemplo "$RUNNER_TEMP/cache/exemplo"
          uv run namescommons run --offline --sources tests/fixtures/sources.yaml --adapters adaptadores \
            --cache "$RUNNER_TEMP/cache" --out "$RUNNER_TEMP/dist" --release 2026.10
          test -s "$RUNNER_TEMP/dist/by_country/PT.csv"
      - name: namescommons run --offline sobre as amostras das fontes oficiais
        run: |
          mkdir -p "$RUNNER_TEMP/cache-oficiais"
          cp -R tests/fixtures/. "$RUNNER_TEMP/cache-oficiais/"
          uv run namescommons run --offline --cache "$RUNNER_TEMP/cache-oficiais" \
            --out "$RUNNER_TEMP/dist-oficiais" --release 2026.10
          for pais in FR IE NO US; do test -s "$RUNNER_TEMP/dist-oficiais/by_country/$pais.csv"; done
