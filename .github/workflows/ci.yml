name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync
      - name: Testes
        run: uv run pytest -q
      - name: namescommons run --offline sobre o cache montado a partir das fixtures
        env:
          PYTHONPATH: tests
        run: |
          mkdir -p "$RUNNER_TEMP/cache"
          cp -R tests/fixtures/exemplo "$RUNNER_TEMP/cache/exemplo"
          uv run namescommons run --offline --sources tests/fixtures/sources.yaml --adapters adaptadores \
            --cache "$RUNNER_TEMP/cache" --out "$RUNNER_TEMP/dist" --release "$(date -u +%Y.%m)"
          test -s "$RUNNER_TEMP/dist/by_country/PT.csv"
      - name: namescommons run --offline sobre as amostras das fontes de sources.yaml
        run: |
          mkdir -p "$RUNNER_TEMP/cache-oficiais"
          find tests/fixtures -mindepth 1 -maxdepth 1 -type d ! -name exemplo ! -name planilhas -exec cp -R {} "$RUNNER_TEMP/cache-oficiais/" \;
          uv run namescommons run --offline --cache "$RUNNER_TEMP/cache-oficiais" \
            --out "$RUNNER_TEMP/dist-oficiais" --release "$(date -u +%Y.%m)"
          for pais in CA ES FR IE NO NZ US; do test -s "$RUNNER_TEMP/dist-oficiais/by_country/$pais.csv"; done
          test -s "$RUNNER_TEMP/dist-oficiais/variant_links.parquet"
          for indice in given_names family_names; do
            uv run python -c 'import csv, sys; linhas = list(csv.DictReader(open(sys.argv[1], encoding="utf-8"))); sys.exit(not linhas or not all(l["group_id"] for l in linhas))' "$RUNNER_TEMP/dist-oficiais/$indice.csv"
          done
